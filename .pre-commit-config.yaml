# Every hook is a thin shell-out to a `make` target, so each check is equally
# runnable by a human (`make <target>`) and by the git hook — one source of
# truth, no second divergent config. No third-party hook repos are pulled in.
#
# Install with `make hooks-install`; run the whole bar on demand with
# `make pre-commit`. See ADR 0003 for why pre-commit is the sole gate.
minimum_pre_commit_version: "3.2.0"
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # gofmt rewrites files in place; when it changes a file, pre-commit
      # reports the modification and aborts so the contributor re-stages.
      - id: fmt
        name: gofmt (auto-format)
        entry: make fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: vet
        name: go vet
        entry: make vet
        language: system
        pass_filenames: false
        always_run: true

      - id: golangci
        name: golangci-lint
        entry: make golangci
        language: system
        pass_filenames: false
        always_run: true

      # Turns ADR 0001/0002 into a build-failing dependency check.
      - id: arch-lint
        name: go-arch-lint (architecture boundaries)
        entry: make arch-lint
        language: system
        pass_filenames: false
        always_run: true

      - id: tidy-check
        name: go mod tidy check
        entry: make tidy-check
        language: system
        pass_filenames: false
        always_run: true

      # Fast suite only. Docker-dependent integration tests and `make build`
      # are deliberately excluded from the hook.
      - id: test
        name: go test (fast suite)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
